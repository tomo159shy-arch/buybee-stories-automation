<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffdf57" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1608" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BuyBee Stories</title>
<style>
  :root{
    --bg:#ffdf57; --surface:#ffffff; --surface-2:#fff6d6;
    --text:#1d1d1f; --text-2:#6e6e73; --hairline:#ecd98f;
    --accent:#0071e3; --accent-press:#0064c8; --danger:#d93a2b;
    --shadow-s:0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
    --shadow-m:0 2px 6px rgba(0,0,0,.08), 0 18px 44px rgba(0,0,0,.14);
    --r-s:12px; --r-m:18px; --r-l:24px; --r-pill:980px;
    --ease:cubic-bezier(.4,0,.2,1);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",
      "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1608; --surface:#221d10; --surface-2:#2e2813;
      --text:#f5f5f7; --text-2:#b8b09a; --hairline:#40391f;
      --accent:#0a84ff; --accent-press:#409cff; --danger:#ff453a;
      --shadow-s:0 1px 2px rgba(0,0,0,.5); --shadow-m:0 14px 44px rgba(0,0,0,.6);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    font-size:16px;line-height:1.5;letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit;color:inherit}

  .icon{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex:none}
  .icon svg{width:100%;height:100%;display:block}

  .nav{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid color-mix(in srgb, var(--hairline) 60%, transparent);
  }
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
  .nav-brand{font-weight:600;font-size:17px;letter-spacing:-.01em}
  .nav-brand b{color:var(--text-2);font-weight:500}

  .largetitle{padding:32px 0 6px;text-align:center}
  h1{margin:0;font-size:clamp(26px,5.2vw,38px);line-height:1.15;font-weight:650;letter-spacing:-.02em}
  .sub{margin:10px 0 0;color:var(--text-2);font-size:15px}

  main{padding-bottom:120px}
  .section-t{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:-.01em;margin:24px 2px 10px}

  .card{background:var(--surface);border:1px solid color-mix(in srgb,var(--hairline) 70%,transparent);
    border-radius:var(--r-m);box-shadow:var(--shadow-s);padding:16px;margin-bottom:12px}

  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--hairline);border-radius:var(--r-l);background:var(--surface);
    box-shadow:var(--shadow-s);padding:36px 16px;text-align:center;cursor:pointer;color:var(--text-2);
    font-size:14px;transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
  .drop:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-m)}
  .drop input{display:none}
  .drop .dicon{width:32px;height:32px;margin-bottom:4px;color:var(--accent)}
  .drop b{color:var(--text);font-weight:600;font-size:16px}

  .pillrow{display:flex;flex-wrap:wrap;gap:8px}
  .pill{cursor:pointer;background:var(--surface);border:1px solid var(--hairline);color:var(--text-2);
    font-size:13px;font-weight:550;letter-spacing:-.01em;padding:8px 14px;border-radius:var(--r-pill);
    box-shadow:var(--shadow-s);transition:color .2s var(--ease),border-color .2s var(--ease),transform .12s var(--ease)}
  .pill:active{transform:scale(.96)}
  .pill.on{color:var(--accent);border-color:var(--accent);font-weight:650}

  label.lbl{display:block;font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:-.01em;margin:14px 0 6px}
  .inp{width:100%;border:1px solid var(--hairline);background:var(--surface);color:var(--text);
    font-size:16px;font-family:inherit;padding:12px 13px;border-radius:var(--r-s);outline:0;
    box-shadow:var(--shadow-s);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  textarea.inp{resize:vertical;line-height:1.4;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
  .swatch-pill{display:inline-flex;align-items:center;gap:6px}
  .swatch-pill .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}

  .btn{border:0;cursor:pointer;font-size:15px;font-weight:600;letter-spacing:-.01em;
    padding:13px 16px;border-radius:var(--r-pill);transition:transform .12s var(--ease),background .2s var(--ease);
    height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-press)}
  .btn-plain{background:var(--surface-2);color:var(--text)}
  .btn-block{width:100%}
  .btn[disabled]{opacity:.4;pointer-events:none}

  .jobcard{background:var(--surface);border:1px solid color-mix(in srgb,var(--hairline) 70%,transparent);
    border-radius:var(--r-m);box-shadow:var(--shadow-s);margin-bottom:14px}
  .jobhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:8px;
    border-bottom:1px solid color-mix(in srgb,var(--hairline) 60%,transparent)}
  .jobhead .name{font-weight:600;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jobhead .status{font-size:11px;font-weight:550;color:var(--text-2);background:var(--surface-2);
    padding:3px 10px;border-radius:var(--r-pill);flex:none}
  .jobbody{padding:16px}
  .scenetabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
  .scenetabs::-webkit-scrollbar{display:none}
  .sceneframe{width:100%;max-height:280px;object-fit:contain;background:var(--surface-2);
    border-radius:var(--r-s);display:block;margin-bottom:14px}

  .urlbox{background:var(--surface-2);border-radius:var(--r-s);padding:14px;overflow:visible}
  .urlbox-label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--text)}

  .checkrow{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:14px;color:var(--text-2)}
  .checkrow input{width:18px;height:18px;accent-color:var(--accent)}

  .rangewrap{margin:14px 0 4px}
  input[type=range]{width:100%;accent-color:var(--accent)}

  .stampregen{display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    color:var(--text-2);border:1px solid var(--hairline);border-radius:var(--r-s);cursor:pointer;height:46px;width:46px;flex:none}
  .stampregen .icon{width:18px;height:18px}

  video{width:100%;border-radius:var(--r-s);background:#000;display:block;margin-top:12px}

  .stars{display:flex;gap:6px;margin:12px 0 8px}
  .star{font-size:24px;cursor:pointer;color:var(--hairline)}
  .star.on{color:var(--accent)}

  .warn{font-size:13px;color:var(--danger);margin-top:8px}
  .muted{color:var(--text-2);font-size:13px}
  .spinner{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:6px;
    border:2px solid color-mix(in srgb,var(--text-2) 35%,transparent);
    border-top-color:var(--text-2);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:8px 16px calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg) 80%,transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid color-mix(in srgb, var(--hairline) 60%, transparent)}
  .dock button{width:100%;max-width:520px;margin:0 auto}
  .dock[hidden]{display:none}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <span class="nav-brand">BuyBee <b>Stories</b></span>
  </div>
</header>

<main class="wrap">
  <div class="largetitle">
    <h1>動画からStoriesを自動生成</h1>
    <p class="sub">動画とURLを貼ると、あとは自動。Geminiが説明文とスタンプを作り、そのまま動画に焼き込みます。</p>
  </div>

  <div id="pushBanner" style="text-align:center;margin-bottom:8px" hidden>
    <button class="pill" id="pushBtn">完成したら通知を受け取る</button>
  </div>

  <div style="text-align:center;margin-bottom:8px">
    <button class="pill" id="libraryToggleBtn">保存した動画を見る</button>
  </div>
  <div id="librarySection" class="card" hidden style="margin-bottom:16px">
    <div id="libraryList" class="muted">読み込み中…</div>
  </div>

  <div class="section-t">動画をアップロード（複数可）</div>
  <label class="drop" id="dropzone">
    <input type="file" id="fileInput" multiple accept="video/mp4,video/quicktime,video/x-msvideo">
    <span id="dropContent"><span class="icon dicon" id="dropIcon"></span>タップして動画を選択<br><b>MP4 / MOV / AVI</b></span>
  </label>

  <div class="urlbox" style="margin-top:10px">
    <div class="urlbox-label"><span class="icon" id="urlIcon"></span>商品ページのURL（任意）</div>
    <div class="muted" style="margin:2px 0 8px">動画と一緒に貼っておくと、説明文に自動で反映されます</div>
    <input class="inp" id="initialUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
      autocomplete="url" spellcheck="false" placeholder="https://...">
  </div>

  <div id="styleSection">
    <div class="section-t">テロップの雰囲気</div>
    <div class="pillrow" id="stylePills"></div>
    <div id="ratingHint" class="muted" style="margin-top:8px"></div>

    <div class="section-t">フォント</div>
    <div class="pillrow" id="fontPills"></div>

    <div class="section-t">文字の色</div>
    <div class="pillrow" id="colorPills"></div>
  </div>

  <div id="jobsSection"></div>

  <div id="exportSection" hidden style="margin-top:20px">
    <button class="btn btn-plain btn-block" id="exportBtn"></button>
  </div>
</main>

<div class="dock" id="dock" hidden>
  <button class="btn btn-primary" id="dockBtn"></button>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// SF Symbols風のシンプルな線画アイコン(絵文字は使わない)
const ICON = {
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M10 6.5l1-1a4 4 0 0 1 5.7 5.7l-1.2 1.2"/><path d="M14 17.5l-1 1a4 4 0 0 1-5.7-5.7l1.2-1.2"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M18.5 3v4h-4M5.5 21v-4h4"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 11.5L12 16l4.5-4.5"/><path d="M4.5 19h15"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13 3.5v4.5h4.5"/><path d="M9 13h6M9 16.5h6"/></svg>',
};

let OPTIONS = null;
let selectedStyle = null;
let jobs = []; // {id, name, status, scenes, activeScene, url, warning, error}

async function api(url, opts){
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(await res.text().catch(()=> 'HTTP '+res.status));
  return res.json();
}

let selectedFont = null;
let selectedTextColor = null;

async function loadOptions(){
  OPTIONS = await api('/api/options');
  selectedStyle = OPTIONS.style_ratings.length
    ? OPTIONS.style_ratings.reduce((a,b)=> b.avg>a.avg?b:a).name
    : OPTIONS.styles[0];
  selectedFont = OPTIONS.fonts[0];
  selectedTextColor = (OPTIONS.text_colors.find(c => c.name === '白') || OPTIONS.text_colors[0]).name;
  renderStylePills();
  renderFontPills();
  renderColorPills();
  setupPushBanner();
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function setupPushBanner(){
  const supported = OPTIONS.push_enabled && 'serviceWorker' in navigator && 'PushManager' in window;
  if (!supported) return;
  if (Notification.permission === 'granted') return; // すでに有効
  $('#pushBanner').hidden = false;
  $('#pushBtn').addEventListener('click', enablePush);
}

async function enablePush(){
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('通知が許可されませんでした');
      return;
    }
    const { publicKey } = await api('/api/push/public-key');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    await api('/api/push/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
    });
    $('#pushBanner').hidden = true;
  } catch (e) {
    alert('通知の設定に失敗しました: ' + e.message
      + (location.protocol !== 'https:' ? '（HTTPSでのみ使えます）' : ''));
  }
}

// 完成した動画は全部サーバー(GCS)に永続保存されるので、ブラウザの
// ジョブ一覧が消えても/再起動があっても、ここから必ず見返せる。
let libraryLoaded = false;
$('#libraryToggleBtn').addEventListener('click', async () => {
  const box = $('#librarySection');
  box.hidden = !box.hidden;
  if (!box.hidden && !libraryLoaded) {
    libraryLoaded = true;
    await loadLibrary();
  }
});

function formatBytes(n){
  if (!n) return '';
  const mb = n / (1024 * 1024);
  return mb >= 1000 ? (mb/1024).toFixed(1) + 'GB' : mb.toFixed(1) + 'MB';
}

async function loadLibrary(){
  const list = $('#libraryList');
  try {
    const { videos } = await api('/api/library');
    if (!videos.length) {
      list.innerHTML = '<div class="muted">まだ保存された動画はありません</div>';
      return;
    }
    list.innerHTML = videos.map(v => {
      const dt = v.created ? new Date(v.created).toLocaleString('ja-JP') : '';
      const url = `/api/library/${encodeURIComponent(v.name)}/video`;
      return `<div style="margin-bottom:18px">
        <video controls playsinline style="width:100%;border-radius:var(--r-s);background:#000"
          src="${url}" preload="none"></video>
        <div class="muted" style="margin-top:4px">${esc(dt)}　${formatBytes(v.size)}</div>
        <a class="btn btn-plain btn-block" style="margin-top:6px;text-decoration:none" href="${url}" download>
          <span class="icon">${ICON.download}</span>ダウンロード</a>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = '<div class="warn">⚠️ 一覧の取得に失敗しました: ' + esc(e.message) + '</div>';
  }
}

function renderStylePills(){
  const box = $('#stylePills'); box.innerHTML = '';
  OPTIONS.styles.forEach(name => {
    const b = document.createElement('button');
    b.className = 'pill' + (name === selectedStyle ? ' on' : '');
    b.textContent = name;
    b.onclick = () => { selectedStyle = name; renderStylePills(); };
    box.appendChild(b);
  });
  const hint = $('#ratingHint');
  if (OPTIONS.style_ratings.length){
    hint.textContent = '過去の評価: ' + OPTIONS.style_ratings.map(r => `${r.name} 平均${r.avg.toFixed(1)}点(n=${r.n})`).join(' / ');
  } else {
    hint.textContent = '';
  }
}

function renderFontPills(){
  const box = $('#fontPills'); box.innerHTML = '';
  OPTIONS.fonts.forEach(name => {
    const b = document.createElement('button');
    b.className = 'pill' + (name === selectedFont ? ' on' : '');
    b.textContent = shortLabel(name);
    b.onclick = () => { selectedFont = name; renderFontPills(); };
    box.appendChild(b);
  });
}

function renderColorPills(){
  const box = $('#colorPills'); box.innerHTML = '';
  OPTIONS.text_colors.forEach(c => {
    const b = document.createElement('button');
    b.className = 'pill swatch-pill' + (c.name === selectedTextColor ? ' on' : '');
    b.innerHTML = `<span class="dot" style="background:${c.hex}"></span>${esc(c.name)}`;
    b.onclick = () => { selectedTextColor = c.name; renderColorPills(); };
    box.appendChild(b);
  });
}

const dropDefaultHTML = () => `<span class="icon dicon" id="dropIcon">${ICON.video}</span>タップして動画を選択<br><b>MP4 / MOV / AVI</b>`;
$('#dropContent').innerHTML = dropDefaultHTML();
$('#urlIcon').innerHTML = ICON.link;
$('#exportBtn').innerHTML = `<span class="icon">${ICON.doc}</span>説明文をテキストで保存（全動画分）`;

function uploadWithProgress(files, onProgress){
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.upload.addEventListener('progress', (e) => {
      if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
    });
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = () => reject(new Error('通信エラー'));
    xhr.send(fd);
  });
}

$('#fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const urlValue = $('#initialUrl').value.trim();
  const content = $('#dropContent');
  content.innerHTML = '<span class="spinner"></span>アップロード中… 0%';
  try {
    const res = await uploadWithProgress(files, (pct) => {
      content.innerHTML = `<span class="spinner"></span>アップロード中… ${pct}%`;
    });
    const newJobs = res.jobs.map(j => ({ id:j.id, name:j.name, status:'uploaded', scenes:null, activeScene:0, url:urlValue, warning:null, error:null }));
    newJobs.forEach(j => jobs.push(j));
    saveJobIds();
    renderJobs();
    updateDock();
    $('#initialUrl').value = '';
    autoRun(newJobs);
  } catch (err) {
    alert('アップロードに失敗しました: ' + err.message);
  } finally {
    content.innerHTML = dropDefaultHTML();
    e.target.value = '';
  }
});

function saveJobIds(){
  try { localStorage.setItem('bb_job_ids', JSON.stringify(jobs.map(j => j.id))); } catch (e) {}
}

async function restoreJobs(){
  let ids = [];
  try { ids = JSON.parse(localStorage.getItem('bb_job_ids') || '[]'); } catch (e) {}
  if (!ids.length) return;
  const restored = [];
  for (const id of ids) {
    try {
      const data = await api(`/api/jobs/${id}`);
      restored.push({
        id, name: data.name, status: data.status, scenes: data.scenes,
        activeScene: 0, url: '', warning: data.warning, error: data.error,
      });
    } catch (e) { /* サーバー再起動等で消えていたら無視 */ }
  }
  jobs = restored;
  saveJobIds();
  if (!restored.length) return;
  $('#styleSection').hidden = false;
  if (jobs.some(j => j.scenes && j.scenes.length)) $('#exportSection').hidden = false;
  renderJobs();
  updateDock();
  jobs.filter(j => j.status === 'analyzing' || j.status === 'rendering').forEach(job => {
    pollJob(job).then(() => { renderJobs(); updateDock(); });
  });
}

function updateDock(){
  const dock = $('#dock'), btn = $('#dockBtn');
  if (!jobs.length){ dock.hidden = true; return; }
  const allAnalyzed = jobs.every(j => j.status === 'analyzed' || j.status === 'rendering' || j.status === 'done');
  const anyAnalyzing = jobs.some(j => j.status === 'analyzing');
  const anyRendering = jobs.some(j => j.status === 'rendering');
  dock.hidden = false;
  if (anyRendering || anyAnalyzing){
    const active = jobs.filter(j => j.status === 'analyzing' || j.status === 'rendering');
    const avg = Math.round(active.reduce((sum, j) => sum + (j.progress || 0), 0) / active.length);
    const label = anyRendering ? '書き出し中' : '分析中';
    btn.innerHTML = `<span class="spinner"></span>${label}... ${avg}%`; btn.disabled = true;
  } else if (allAnalyzed){
    btn.textContent = `${jobs.length}本まとめて焼き込む`; btn.disabled = false;
    btn.onclick = renderAll;
  } else {
    btn.textContent = `${jobs.length}本を分析する`; btn.disabled = false;
    btn.onclick = analyzeAll;
  }
}

// 'analyzed'では止まらない。分析が終わったらサーバー側がそのまま書き出しまで
// 自動で続ける(画面を閉じていても最後まで完成させるため)ので、ここでは
// 'done'/'error'になるまで待てば良い。
async function pollJob(job){
  return waitUntilSettled(job);
}

// サーバー側は同期的に(書き出しまで)処理するため、モバイルSafari等で
// 画面を離れたりスリープしたりすると、POSTの接続自体が"Load failed"の
// ような通信エラーで切れることがある。ただしこれはブラウザ側の接続が
// 切れただけで、サーバー側の処理は裏で続いている可能性が高い。
// なので接続エラーだけで即「失敗」と決めず、実際のジョブ状態を
// 確認できるまでポーリングし続け、サーバーが本当にdone/errorを
// 返すまで諦めない。書き出し中はCloud Runの1インスタンスがCPUを
// 使い切り、状態確認のポーリング自体が何度も429で失敗することが
// あるため、失敗「回数」ではなく最後に成功してからの経過時間で
// 判定する(サーバー側のリクエストタイムアウト(15分)より長く待つ)。
async function waitUntilSettled(job){
  let lastSuccess = Date.now();
  const GIVE_UP_MS = 16 * 60 * 1000;
  while (true){
    try {
      const data = await api(`/api/jobs/${job.id}`);
      job.status = data.status; job.progress = data.progress;
      job.scenes = data.scenes; job.warning = data.warning; job.error = data.error;
      renderJobs(); updateDock();
      lastSuccess = Date.now();
      if (['done','error'].includes(job.status)) return data;
    } catch (e) {
      if (Date.now() - lastSuccess >= GIVE_UP_MS){
        job.status = 'error';
        job.error = '通信状態が悪く状態を確認できませんでした。電波の良い場所でこの画面をもう一度開いてみてください。';
        renderJobs(); updateDock();
        return null;
      }
    }
    await new Promise(r => setTimeout(r, 3000));
  }
}

// 分析~書き出しはサーバー側で自動連携される(このPOST自体が完了まで
// 待つ作りになっている)。画面を閉じても(プッシュ通知が有効なら)
// 完成時に通知が来る。POSTの接続が途中で切れても、下のポーリングが
// 実際のジョブ状態を確認し続けるので大丈夫。
async function analyzeJob(job){
  job.status = 'analyzing'; job.progress = 0;
  renderJobs(); updateDock();
  try {
    const fd = new FormData();
    fd.append('style_key', selectedStyle);
    fd.append('product_url', job.url || '');
    fd.append('font_choice', selectedFont || '');
    fd.append('text_color', selectedTextColor || '');
    await api(`/api/jobs/${job.id}/analyze`, { method:'POST', body: fd });
  } catch (e) { /* 接続エラーは無視。下のポーリングで本当の状態を確認する */ }
  await waitUntilSettled(job);
  renderJobs(); updateDock();
  if (job.status === 'done'){
    const el = document.getElementById(`video-${job.id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// 編集後の再書き出し用(初回の自動書き出しはanalyzeJobがサーバー側の
// 連携で完了させるので、これは手動での再生成にのみ使う)。
async function renderJob(job){
  job.status = 'rendering'; job.progress = 55;
  renderJobs(); updateDock();
  try {
    await flushSync(job);
    await api(`/api/jobs/${job.id}/render`, { method:'POST' });
  } catch (e) { /* 接続エラーは無視。下のポーリングで本当の状態を確認する */ }
  await waitUntilSettled(job);
  renderJobs(); updateDock();
  if (job.status === 'done'){
    const el = document.getElementById(`video-${job.id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// アップロード直後に呼ばれ、分析→書き出しまで人の手を挟まず自動で進める
async function autoRun(newJobs){
  await Promise.all(newJobs.map(analyzeJob));
  $('#exportSection').hidden = false;
}

async function analyzeAll(){
  await Promise.all(jobs.filter(j => j.status === 'uploaded' || j.status === 'error').map(analyzeJob));
  $('#exportSection').hidden = false;
}

async function renderAll(){
  await Promise.all(jobs.map(renderJob));
}

const syncTimers = {};
function sceneField(job, i, key, value){
  job.scenes[i][key] = value;
  syncScenes(job);
}

function syncScenes(job){
  // 連続入力のたびに送信すると通信が競合しうるので、少し待ってまとめて送る
  clearTimeout(syncTimers[job.id]);
  syncTimers[job.id] = setTimeout(() => flushSync(job), 500);
}

async function flushSync(job){
  clearTimeout(syncTimers[job.id]);
  await api(`/api/jobs/${job.id}/scenes`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ scenes: job.scenes }),
  });
}

function renderJobs(){
  const box = $('#jobsSection'); box.innerHTML = '';
  jobs.forEach(job => box.appendChild(jobCard(job)));
}

function jobCard(job){
  const el = document.createElement('div');
  el.className = 'jobcard';

  const showsProgress = job.status === 'analyzing' || job.status === 'rendering';
  const statusLabel = {
    uploaded:'待機中', analyzing:'分析中…', analyzed:'編集可能',
    rendering:'書き出し中…', done:'完成', error:'エラー',
  }[job.status] || job.status;
  const statusText = showsProgress ? `${statusLabel} ${job.progress || 0}%` : statusLabel;

  let head = `<div class="jobhead"><div class="name">${esc(job.name)}</div><div class="status">${esc(statusText)}</div></div>`;
  let body = '<div class="jobbody">';

  if (job.status === 'uploaded'){
    body += `<div class="urlbox">
      <div class="urlbox-label"><span class="icon">${ICON.link}</span>商品ページのURL（任意）</div>
      <div class="muted" style="margin:2px 0 8px">貼ると、ページの情報も見た目と合わせて説明文に反映します</div>
      <input class="inp" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
        autocomplete="url" spellcheck="false" placeholder="https://..." value="${esc(job.url)}" data-role="url">
    </div>`;
  }

  if (job.error){
    body += `<div class="warn">⚠️ ${esc(job.error)}</div>`;
  } else if (job.warning){
    body += `<div class="warn">⚠️ ${esc(job.warning)}</div>`;
  }

  if (job.scenes && job.scenes.length){
    body += '<div class="scenetabs">';
    job.scenes.forEach((s, i) => {
      body += `<button class="pill${i===job.activeScene?' on':''}" data-scene-tab="${i}">シーン${i+1}</button>`;
    });
    body += '</div>';
    body += sceneForm(job, job.activeScene);
  }

  if (job.status === 'done'){
    body += `<video id="video-${job.id}" controls autoplay muted loop playsinline
        src="/api/jobs/${job.id}/video?t=${Date.now()}"></video>
      <p class="muted" style="text-align:center;margin:8px 0 0">
        iPhoneの場合: 動画を長押し→「ビデオを保存」でカメラロールに保存できます</p>
      <a class="btn btn-primary btn-block" style="margin-top:10px;text-decoration:none"
        href="/api/jobs/${job.id}/video" download><span class="icon">${ICON.download}</span>動画をダウンロード</a>
      <div class="lbl" style="margin-top:16px">この動画を5段階で評価</div>
      <div class="stars" data-rate-box></div>`;
  }

  body += '</div>';
  el.innerHTML = head + body;

  const urlInput = el.querySelector('[data-role="url"]');
  if (urlInput) urlInput.addEventListener('input', e => { job.url = e.target.value; });

  el.querySelectorAll('[data-scene-tab]').forEach(btn => {
    btn.addEventListener('click', () => { job.activeScene = Number(btn.dataset.sceneTab); renderJobs(); });
  });

  wireSceneForm(el, job);

  if (job.status === 'done'){
    const starBox = el.querySelector('[data-rate-box]');
    let rated = job.ratedValue || 0;
    function drawStars(){
      starBox.innerHTML = '';
      for (let i=1;i<=5;i++){
        const s = document.createElement('span');
        s.className = 'star' + (i<=rated ? ' on' : '');
        s.textContent = '★';
        s.onclick = async () => {
          rated = i; job.ratedValue = i; drawStars();
          await api(`/api/jobs/${job.id}/rate`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ rating: i }),
          });
          loadOptions();
        };
        starBox.appendChild(s);
      }
    }
    drawStars();
  }

  return el;
}

const shortLabel = s => s.split('（')[0];

function colorPills(fieldName, colors, current){
  return `<div class="pillrow" data-pillgroup="${fieldName}">${colors.map(c => `
    <button type="button" class="pill swatch-pill${c.name===current?' on':''}" data-value="${esc(c.name)}">
      <span class="dot" style="background:${c.hex}"></span>${esc(c.name)}
    </button>`).join('')}</div>`;
}

function fontPills(fieldName, fonts, current){
  return `<div class="pillrow" data-pillgroup="${fieldName}">${fonts.map(f => `
    <button type="button" class="pill${f===current?' on':''}" data-value="${esc(f)}">${esc(shortLabel(f))}</button>`).join('')}</div>`;
}

function sceneForm(job, i){
  const s = job.scenes[i];
  return `
    <img class="sceneframe" src="/api/jobs/${job.id}/scene/${i}/frame" alt="シーン${i+1}のフレーム"
      onerror="this.style.display='none'">
    <div class="checkrow"><input type="checkbox" data-f="skip" ${s.skip?'checked':''}> このシーンにはテロップ・スタンプを入れない</div>
    <label class="lbl">キャッチコピー</label>
    <input class="inp" data-f="title" value="${esc(s.title)}">
    <label class="lbl">特徴（改行で複数行）</label>
    <textarea class="inp" data-f="body">${esc(s.body)}</textarea>
    <label class="lbl">価格</label>
    <input class="inp" data-f="price" value="${esc(s.price)}">
    <label class="lbl">文字の大きさ</label>
    <div class="rangewrap"><input type="range" min="0.6" max="1.6" step="0.1" value="${s.text_scale}" data-f="text_scale"></div>
    <label class="lbl">フォント</label>
    ${fontPills('font_choice', OPTIONS.fonts, s.font_choice)}
    <label class="lbl">文字の色</label>
    ${colorPills('text_color', OPTIONS.text_colors, s.text_color)}
    <label class="lbl">スタンプ文言</label>
    <div class="row3">
      <input class="inp" data-f="stamp_text" value="${esc(s.stamp_text)}">
      <button type="button" class="stampregen" data-regen title="スタンプ文言・色を再生成"><span class="icon">${ICON.refresh}</span></button>
    </div>
    <label class="lbl">スタンプ色</label>
    ${colorPills('stamp_color', OPTIONS.stamp_colors, s.stamp_color)}
  `;
}

function wireSceneForm(el, job){
  const i = job.activeScene;
  if (!job.scenes || !job.scenes[i]) return;
  el.querySelectorAll('[data-pillgroup]').forEach(group => {
    const key = group.dataset.pillgroup;
    group.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        sceneField(job, i, key, btn.dataset.value);
        renderJobs();
      });
    });
  });
  el.querySelectorAll('[data-f]').forEach(input => {
    const key = input.dataset.f;
    const handler = () => {
      let val = input.type === 'checkbox' ? input.checked : input.value;
      if (key === 'text_scale') val = parseFloat(val);
      sceneField(job, i, key, val);
    };
    input.addEventListener(input.tagName === 'SELECT' || input.type==='range' ? 'change' : 'input', handler);
  });
  const regen = el.querySelector('[data-regen]');
  if (regen) regen.addEventListener('click', async () => {
    const s = job.scenes[i];
    const r = await api('/api/stamp/shuffle', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: s.stamp_text, color: s.stamp_color }),
    });
    s.stamp_text = r.text; s.stamp_color = r.color;
    syncScenes(job);
    renderJobs();
  });
}

$('#exportBtn').addEventListener('click', () => {
  const parts = jobs.map(job => {
    const scenes = (job.scenes || []).filter(s => !s.skip).map((s, i) =>
      `[シーン${i+1}]\n${s.title||''}\n${s.body||''}\n${s.price||''}`
    ).join('\n\n');
    return `=== ${job.name} ===\n${scenes}`;
  });
  const blob = new Blob([parts.join('\n\n\n')], { type:'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'buybee_description.txt';
  a.click();
});

loadOptions();
restoreJobs();
</script>
</body>
</html>
